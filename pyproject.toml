[project.scripts]
constant-gen = "api.cli_tool:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["F403", "F405", "E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"tools/*" = ["E402"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pre-commit>=3.5.0",
]
